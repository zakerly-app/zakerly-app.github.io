<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذاكرلي</title>
<meta name="description" content="ذاكرلي — رفيقك في المذاكرة.">
<link rel="icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1b3d; --card:#16264f; --ink:#ffffff; --soft:#b9c6e8; --accent:#6bc8e8; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: radial-gradient(circle at 50% 0%, #1d3270 0%, var(--bg) 60%);
         color: var(--ink); font-family: 'Cairo', system-ui, sans-serif; text-align: center; }
  main { width: 100%; max-width: 440px; }
  img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 0 0 8px rgba(107,200,232,.12), 0 18px 40px rgba(0,0,0,.35); }
  h1 { font-size: 34px; font-weight: 900; margin-top: 28px; line-height: 1.4; }
  h1 span { color: var(--accent); }
  p { color: var(--soft); font-size: 18px; margin-top: 10px; line-height: 1.8; }
  a.btn { display: inline-block; margin-top: 32px; padding: 14px 34px; border-radius: 999px;
          background: var(--accent); color: var(--bg); font-weight: 700; font-size: 18px; text-decoration: none; }
  a.btn:active { transform: scale(.97); }
  footer { margin-top: 48px; color: #7f8db3; font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="ذاكرلي">
  <h1>أهلا بيك في <span>ذاكرلي</span></h1>
  <p>رفيقك في المذاكرة 🤍</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.zakerly.ai">حمّل التطبيق</a>
  <footer>© ذاكرلي</footer>
</main>
</body>
</html>
